services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: job_queue
      POSTGRES_USER: job_queue
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_queue -d job_queue"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: